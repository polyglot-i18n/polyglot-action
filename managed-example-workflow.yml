# Copy this file to .github/workflows/polyglot.yml in the connected repository.
# Polyglot deliberately pins the reusable workflow to a complete commit SHA.
name: Polyglot
# Names a dashboard-requested run after its Polyglot run ID so Polyglot can
# follow it before it authenticates. Push and pull request runs keep GitHub's
# usual title (an empty run-name falls back to it).
run-name: ${{ inputs.run_id != '' && format('Polyglot {0} {1}', inputs.operation, inputs.run_id) || '' }}

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Polyglot operation
        required: true
        type: choice
        default: check
        options: [check, catalog_sync, publish]
      run_id:
        description: Polyglot dashboard run ID (leave empty for a standalone run)
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: polyglot-${{ github.repository }}-${{ github.ref }}-${{ inputs.operation || 'check' }}
  cancel-in-progress: true

jobs:
  polyglot:
    uses: polyglot-i18n/polyglot-action/.github/workflows/managed.yml@1561cbd20771004350f630b229ec76926edc6584
    with:
      operation: ${{ inputs.operation || 'check' }}
      run_id: ${{ inputs.run_id || '' }}

# Long-running checks: raise the job's own limit (up to 360 minutes on
# GitHub-hosted runners) and the project's run budget in Polyglot together:
#
#   jobs:
#     polyglot:
#       uses: polyglot-i18n/polyglot-action/.github/workflows/managed.yml@<pinned SHA>
#       with:
#         operation: ${{ inputs.operation || 'check' }}
#         run_id: ${{ inputs.run_id || '' }}
#         timeout_minutes: 120
#
# Monorepos connect one Polyglot project per config root. A workflow job speaks
# for exactly one of them, so name the root in each job:
